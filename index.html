<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="お店スナップショット">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15161a">
<title>お店スナップショット共有アプリ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#15161a; --panel:#1e2025; --panel2:#25272d; --accent:#e0a458; --accent-d:#b9803a;
    --text:#f2ede4; --sub:#a7a49d; --danger:#d9645a; --ok:#6fae7d; --line:#33353b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#0b0c0e;color:var(--text);display:flex;justify-content:center;padding:20px 10px;}
  .app-wrap{width:420px;max-width:100%;}
  .role-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .role-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--sub);font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    transition:transform .08s,background .08s;}
  .role-tabs button:active:not(:disabled){transform:scale(.96);background:var(--panel2);}
  .role-tabs button.active{background:var(--accent);color:#1a1a1a;font-weight:bold;border-color:var(--accent);}
  .role-tabs button:disabled{opacity:.35;cursor:not-allowed;}
  .phone{background:var(--bg);border:1px solid var(--line);border-radius:26px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);min-height:640px;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .topbar .title{font-size:15px;font-weight:bold;}
  .topbar .info-btn{background:none;border:1px solid var(--line);color:var(--sub);border-radius:50%;
    width:28px;height:28px;cursor:pointer;font-size:13px;}
  .screen{flex:1;padding:18px 16px 90px;overflow-y:auto;}
  .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:bold;
    cursor:pointer;margin-bottom:10px;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    transition:transform .08s,opacity .08s;}
  .btn:active{transform:scale(.97);opacity:.85;}
  .btn-primary{background:var(--accent);color:#1a1a1a;}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn-ghost{background:none;color:var(--sub);border:none;font-size:13px;text-decoration:underline;padding:6px;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;width:auto;display:inline-block;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .muted{color:var(--sub);font-size:13px;line-height:1.6;}
  .tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;background:var(--panel2);color:var(--sub);
    border:1px solid var(--line);margin-right:6px;}
  .tag.ok{color:var(--ok);border-color:var(--ok);}
  .tag.warn{color:var(--accent);border-color:var(--accent);}
  .big-post-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--accent),var(--accent-d));color:#1a1a1a;border:none;border-radius:20px;
    width:100%;padding:34px 10px;font-size:17px;font-weight:bold;cursor:pointer;margin:18px 0;}
  .big-post-btn span.ic{font-size:34px;margin-bottom:6px;}
  h2{font-size:17px;margin:0 0 10px;}
  h3{font-size:14px;margin:0 0 8px;color:var(--accent);}
  .row{display:flex;gap:10px;align-items:center;}
  .row.between{justify-content:space-between;}
  select, input[type=text], textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .chip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0;}
  .chip{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    text-align:center;font-size:13px;cursor:pointer;}
  .chip.selected{border-color:var(--accent);color:var(--accent);}
  .banner{background:#2a2416;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;
    margin-bottom:14px;line-height:1.6;}
  .banner.notice{background:var(--panel2);border-color:var(--line);color:var(--sub);}
  .post-row{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;margin-bottom:10px;align-items:center;}
  .post-row img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .post-row .meta{flex:1;font-size:12px;color:var(--sub);}
  .post-row .meta .cap{color:var(--text);font-size:13px;margin-top:2px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .status-dot.open{background:var(--ok);}
  .status-dot.closed{background:var(--sub);}
  .store-card{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .08s;}
  .store-card:active{opacity:.75;}
  .store-card.photo-card{padding:0;overflow:hidden;}
  .store-photo-wrap{position:relative;width:100%;aspect-ratio:4/3;background:var(--panel2);overflow:hidden;}
  .store-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .no-photo-cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;
    background:linear-gradient(160deg, var(--accent-d), #2a2320);}
  .no-photo-cover .no-photo-icon{font-size:34px;opacity:.9;}
  .no-photo-cover .no-photo-name{color:#f2ede4;font-weight:bold;font-size:15px;letter-spacing:.02em;}
  .store-photo-badges{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;
    align-items:flex-start;pointer-events:none;}
  .store-photo-badges .right-group{display:flex;align-items:center;gap:5px;}
  .store-photo-wrap img.store-symbol-icon{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:rgba(20,21,24,.72);
    color:#fff;backdrop-filter:blur(2px);}
  .pill.ok{color:#bdeecb;}
  .store-photo-flash{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;}
  .store-card-caption{padding:10px 14px 12px;}
  .store-card-caption .name{font-weight:bold;font-size:15px;}
  .latest-post-hero{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;}
  .latest-post-hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--panel2);}
  .latest-post-caption{padding:8px 12px;background:var(--panel);font-size:13px;}
  .radio-line{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2d33;color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13px;border:1px solid var(--line);z-index:60;opacity:0;
    transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .footer-note{text-align:center;color:#5c5e64;font-size:11px;margin-top:16px;}
  .nav-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px;overflow:hidden;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .08s;}
  .nav-row:active{background:var(--panel2);}
  .nav-row .nav-label{display:flex;align-items:center;gap:10px;}
  .nav-row .nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .nav-row:last-child{border-bottom:none;}
  .nav-row.nav-row-stack{display:block;}
  .nav-row-sub{margin-top:4px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .murmur-card{padding:12px 14px;}
  .murmur-teaser{margin-top:10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .08s;}
  .murmur-teaser:active{background:var(--panel2);}
  .murmur-teaser-body{font-size:13px;line-height:1.4em;min-height:2.8em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .gacha-card{margin-top:10px;}
  .gacha-result{display:flex;align-items:center;gap:8px;font-size:14px;}
  .gacha-result-icon{font-size:20px;flex-shrink:0;}
  .gacha-cheers-received{margin-top:10px;padding:12px 14px;}
  .gacha-cheer-row{font-size:13px;margin-bottom:4px;}
  .gacha-cheer-row:last-child{margin-bottom:0;}
  .gacha-machine{position:relative;width:110px;height:150px;margin:0 auto;}
  .gacha-dome{position:relative;width:96px;height:66px;margin:0 auto;
    background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), var(--panel2);
    border:2px solid var(--accent-d);border-radius:48px 48px 16px 16px/58px 58px 16px 16px;
    overflow:hidden;animation:gachaSway 1s ease-in-out infinite;}
  .gacha-ball{position:absolute;width:15px;height:15px;border-radius:50%;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.3), inset 2px 2px 2px rgba(255,255,255,.35);}
  .gacha-ball:nth-child(1){top:6px;left:10px;background:var(--accent);}
  .gacha-ball:nth-child(2){top:4px;left:38px;background:var(--danger);}
  .gacha-ball:nth-child(3){top:8px;left:64px;background:var(--ok);}
  .gacha-ball:nth-child(4){top:28px;left:18px;background:#e8c27a;}
  .gacha-ball:nth-child(5){top:32px;left:46px;background:var(--sub);}
  .gacha-ball:nth-child(6){top:26px;left:70px;background:var(--accent-d);}
  .gacha-neck{width:24px;height:9px;margin:0 auto;background:var(--accent-d);}
  .gacha-cabinet{position:relative;width:84px;height:42px;margin:0 auto;
    background:linear-gradient(180deg,var(--accent-d),#7a5424);border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.35);}
  .gacha-window{position:absolute;left:9px;top:8px;width:32px;height:20px;background:rgba(0,0,0,.28);border-radius:4px;}
  .gacha-knob{position:absolute;right:11px;top:12px;width:17px;height:17px;border-radius:50%;
    background:var(--accent);border:2px solid rgba(255,255,255,.25);animation:gachaKnobTurn 1s linear infinite;}
  .gacha-chute{position:relative;width:28px;height:26px;margin:0 auto;overflow:hidden;}
  .gacha-capsule{position:absolute;left:6px;top:-18px;width:15px;height:15px;border-radius:50%;
    background:linear-gradient(180deg,#fff 0 50%, var(--accent) 50% 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.4);animation:gachaCapsuleDrop 1s ease-in infinite;}
  .back-link{color:var(--sub);font-size:13px;cursor:pointer;margin-bottom:10px;display:inline-block;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:4px 0;}
  .back-link:active{opacity:.6;}
  .modal-detail-img{width:100%;border-radius:10px;margin-bottom:10px;}
  .spinner{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--sub);font-size:13px;}
  @keyframes gachaSway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
  }
  @keyframes gachaKnobTurn{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes gachaCapsuleDrop{
    0%{top:-18px;opacity:0;}
    12%{opacity:1;}
    68%{top:22px;opacity:1;}
    85%{top:22px;opacity:0;}
    100%{top:-18px;opacity:0;}
  }
  @media (max-width: 480px){
    body{padding:0;display:block;align-items:normal;}
    .app-wrap{width:100%;max-width:100%;}
    .role-tabs{padding:calc(env(safe-area-inset-top, 0px) + 10px) 10px 6px;margin-bottom:0;background:#0b0c0e;
      position:sticky;top:0;z-index:100;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;}
    .phone{border-radius:0;border:none;box-shadow:none;min-height:calc(100vh - 60px);}
    .screen{padding-bottom:calc(100px + env(safe-area-inset-bottom, 0px));}
    .footer-note{padding:0 14px 16px;}
  }
</style>
</head>

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function showModal(html){ document.getElementById('modal-root').innerHTML =
  `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal-box">${html}</div></div>`; }

function ownerStoreIds(){ return cache.memberships.filter(m=>m.role==='owner').map(m=>m.store_id); }
function isOwnerAnywhere(){ return ownerStoreIds().length > 0; }
function storeById(id){ return cache.stores.find(s=>s.id===id); }

/* ===================== 初期化 ===================== */
async function init(){
  let { data:{ session } } = await sb.auth.getSession();
  if(!session){
    const { error } = await sb.auth.signInAnonymously();
    if(error){
      document.getElementById('screen').innerHTML =
        `<div class="banner" style="border-color:var(--danger);">接続エラー: ${error.message}<br><br>Supabaseの「Allow anonymous sign-ins」がONになっているか確認してください。</div>`;
      return;
    }
  }
  const { data:{ user } } = await sb.auth.getUser();
  state.user = user;

  await loadStores();
  await reloadMemberships();

  if(cache.memberships.length === 0){
    state.screen = 'invite';
  } else {
    state.role = isOwnerAnywhere() ? 'owner' : 'visitor';
    state.currentStoreId = isOwnerAnywhere() ? ownerStoreIds()[0] : (cache.stores[0] && cache.stores[0].id);
    state.screen = state.role === 'owner' ? 'home' : 'vlist';
  }
  await go(state.screen);
}

async function reloadMemberships(){
  const { data, error } = await sb.from('memberships').select('*');
  if(error) toast('[診断] memberships読み込みエラー: ' + error.message);
  cache.memberships = data || [];
}
async function loadStores(){
  const { data, error } = await sb.from('stores').select('*').order('id');
  if(error) toast('[診断] stores読み込みエラー: ' + error.message);
  cache.stores = data || [];
}

/* ===================== 招待コード ===================== */
let inviteSubmitting = false;
async function submitInvite(){
  if(inviteSubmitting) return;
  const code = document.getElementById('inviteCode').value.trim();
  const nickname = document.getElementById('inviteNickname').value.trim() || 'ゲスト';
  if(!code){ toast('招待コードを入力してください'); return; }

  inviteSubmitting = true;
  const btn = document.getElementById('inviteSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '処理中…'; }

  try {
    const master = await sb.rpc('redeem_master_key', { p_code: code });
    if(!master.error){
      await loadStores();
      await reloadMemberships();
      state.role = 'owner';
      state.currentStoreId = ownerStoreIds()[0];
      toast('マスターアクセスを有効にしました');
      await go('home');
      return;
    }

    const { error } = await sb.rpc('redeem_invite', { p_code: code, p_nickname: nickname });
    if(error){
      // 二重タップ等で実際には成功している場合があるため、念のため再確認する
      await loadStores();
      await reloadMemberships();
      if(cache.memberships.length > 0){
        state.role = isOwnerAnywhere() ? 'owner' : 'visitor';
        state.currentStoreId = isOwnerAnywhere() ? ownerStoreIds()[0] : (cache.stores[0] && cache.stores[0].id);
        toast('参加しました');
        await go(state.role === 'owner' ? 'home' : 'vlist');
        return;
      }
      toast('招待コードが無効か、使用済みです');
      return;
    }
    await loadStores();
    await reloadMemberships();
    state.role = isOwnerAnywhere() ? 'owner' : 'visitor';
    state.currentStoreId = isOwnerAnywhere() ? ownerStoreIds()[0] : (cache.stores[0] && cache.stores[0].id);
    toast('参加しました');
    await go(state.role === 'owner' ? 'home' : 'vlist');
  } finally {
    inviteSubmitting = false;
    if(btn){ btn.disabled = false; btn.textContent = '参加する'; }
  }
}
function renderInvite(){
  return `
    <h2>招待コードで参加</h2>
    <div class="muted" style="margin-bottom:12px;">招待制です。お店から受け取ったコードと、ニックネームを入れてください。</div>
    <div class="card">
      <div class="muted" style="margin-bottom:6px;">招待コード</div>
      <input type="text" id="inviteCode" placeholder="例: REG-0001" value="${PREFILL_CODE}" style="margin-bottom:12px;">
      <div class="muted" style="margin-bottom:6px;">ニックネーム</div>
      <input type="text" id="inviteNickname" placeholder="例: たけし">
    </div>
    <button class="btn btn-primary" id="inviteSubmitBtn" onclick="submitInvite()">参加する</button>
    <div class="muted" style="margin-top:10px;">※本名やメールアドレスは不要です。この端末だけに紐づきます。</div>
  `;
}

/* ===================== ユーティリティ ===================== */
function isOpenNow(store){
  const now = new Date();
  if(store.closed_day !== null && store.closed_day === now.getDay()) return 'closed';
  const m = now.getHours()*60 + now.getMinutes();
  const open = store.open_min, close = store.close_min;
  let openNow;
  if(close > 1440){ openNow = (m >= open) || (m < close-1440); }
  else { openNow = (m >= open && m < close); }
  return openNow ? 'open' : 'prep';
}
function relTime(ts){
  const diff = Date.now() - new Date(ts).getTime();
  const min = Math.floor(diff/60000), hr = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if(min < 60) return (min<=0?'たった今':min+'分前');
  if(hr < 24) return hr+'時間前';
  return d+'日前';
}
function absTime(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function monthLabel(ts){ const d=new Date(ts); return `${d.getFullYear()}年${d.getMonth()+1}月`; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function settingsFor(storeId){
  return (cache.allSettings||[]).find(s=>s.store_id===storeId) || {};
}
function isVacantToday(set){ return !!(set && set.vacancy_on && set.vacancy_date === todayStr()); }
function vacancyLevel(set){ return isVacantToday(set) ? (set.vacancy_level || 'normal') : null; }
function detailDisclosureOn(set){ return !(set && set.detail_disclosure_on === false); }
function isRainSpecialToday(set){ return !!(set && set.rain_special_on && set.rain_special_date === todayStr()); }
function truncateText(text, n){
  if(!text) return '';
  return text.length > n ? text.slice(0, n) + '…' : text;
}
function placeholderImg(label, bg){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'>
    <rect width='100%' height='100%' fill='${bg}'/>
    <text x='50%' y='50%' font-size='20' fill='#eee6d8' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>${label}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ===================== データ取得 ===================== */
async function loadPosts(storeId, limit){
  let q = sb.from('posts').select('*').eq('store_id', storeId).order('created_at', {ascending:false});
  if(limit) q = q.limit(limit);
  const { data } = await q;
  cache.posts[storeId] = data || [];
  return cache.posts[storeId];
}
async function loadPerformers(storeId){
  const { data } = await sb.from('performers').select('*').eq('store_id', storeId);
  cache.performers[storeId] = data || [];
  return cache.performers[storeId];
}
async function loadSettings(storeId){
  const { data } = await sb.from('store_settings').select('*').eq('store_id', storeId).maybeSingle();
  cache.settings[storeId] = data || { store_id: storeId, notif:'none', paused:false };
  return cache.settings[storeId];
}
function myVisiblePosts(storeId){
  return (cache.posts[storeId]||[]).filter(p=>p.visible && !p.draft);
}
async function loadRecommendations(){
  const { data } = await sb.from('recommendations').select('*');
  cache.recommendations = data || [];
  return cache.recommendations;
}
async function loadPeerSettings(){
  const { data } = await sb.from('store_settings').select('*');
  cache.allSettings = data || [];
  return cache.allSettings;
}
async function loadMurmurs(){
  const { data, error } = await sb.from('owner_murmurs').select('*').order('created_at', {ascending:false}).limit(100);
  if(error){ cache.murmurs = []; return cache.murmurs; }
  cache.murmurs = data || [];
  return cache.murmurs;
}
async function loadGachaToday(){
  const { data } = await sb.from('owner_gacha_pulls').select('*').eq('store_id', state.currentStoreId).eq('pulled_date', todayStr()).maybeSingle();
  cache.gachaToday[state.currentStoreId] = data || null;
  return cache.gachaToday[state.currentStoreId];
}
async function loadReceivedCheers(){
  const { data, error } = await sb.from('owner_gacha_pulls').select('*')
    .eq('target_store_id', state.currentStoreId).eq('card_type', 'cheer')
    .order('created_at', {ascending:false}).limit(5);
  cache.receivedCheers = error ? [] : (data || []);
  return cache.receivedCheers;
}
async function loadStoreMates(storeId){
  const { data } = await sb.from('memberships').select('*').eq('store_id', storeId).eq('role','regular').eq('show_nickname', true);
  cache.storeMates[storeId] = data || [];
  return cache.storeMates[storeId];
}
async function loadStoreRegulars(storeId){
  // RLS returns: regulars at my own store, plus (for people who are already my own
  // regulars) their regular memberships at other stores too — used to show, per regular,
  // which other participating stores they're also part of.
  const { data } = await sb.from('memberships').select('*').eq('role','regular');
  cache.regularNetwork = data || [];
  cache.storeRegulars[storeId] = cache.regularNetwork.filter(m=>m.store_id===storeId);
  return cache.storeRegulars[storeId];
}
async function loadFindVideoUrl(storeId){
  const store = storeById(storeId);
  if(!store || !store.find_video_path){ cache.findVideoUrls[storeId] = null; return null; }
  const { data, error } = await sb.storage.from('store-videos').createSignedUrl(store.find_video_path, 3600);
  cache.findVideoUrls[storeId] = (!error && data) ? data.signedUrl : null;
  return cache.findVideoUrls[storeId];
}
function otherStoresFor(userId, excludeStoreId){
  return (cache.regularNetwork||[])
    .filter(m=>m.user_id===userId && m.store_id!==excludeStoreId)
    .map(m=>storeById(m.store_id))
    .filter(Boolean)
    .map(s=>s.name);
}

/* ===================== 画面遷移 ===================== */
async function go(screen){
  state.screen = screen;
  render(); // まず今あるデータで即座に画面を切り替え、後から新しいデータで更新する(反応を速く感じさせるため)
  if(screen==='home'){ await loadPosts(state.currentStoreId, 5); }
  if(screen==='history'){ await loadPosts(state.currentStoreId); }
  if(screen==='home'){
    await Promise.all([ loadRecommendations(), loadSettings(state.currentStoreId), loadMurmurs(), loadGachaToday(), loadReceivedCheers() ]);
  }
  if(screen==='settings'){ await Promise.all([loadSettings(state.currentStoreId), loadPerformers(state.currentStoreId)]); }
  if(screen==='vlist'){ await Promise.all([Promise.all(cache.stores.map(s=>loadPosts(s.id, 6))), loadPeerSettings()]); }
  if(screen==='vdetail'){
    await Promise.all([
      loadPosts(state.currentStoreId),
      loadRecommendations(),
      loadStoreMates(state.currentStoreId),
      loadPeerSettings(),
      loadFindVideoUrl(state.currentStoreId)
    ]);
  }
  if(screen==='peers'){ await Promise.all([Promise.all(cache.stores.map(s=>loadPosts(s.id, 6))), loadPeerSettings()]); }
  if(screen==='recommendRequests'){ await loadRecommendations(); }
  if(screen==='regularNotes'){ await loadStoreRegulars(state.currentStoreId); }
  if(screen==='murmurs'){ await loadMurmurs(); }
  render();
}

async function toggleVacancy(level){
  const set = cache.settings[state.currentStoreId] || {};
  const currentLevel = vacancyLevel(set);
  const turningOn = currentLevel !== level;
  await sb.from('store_settings').update({
    vacancy_on: turningOn,
    vacancy_date: turningOn ? todayStr() : set.vacancy_date,
    vacancy_level: turningOn ? level : set.vacancy_level
  }).eq('store_id', state.currentStoreId);
  await loadSettings(state.currentStoreId);
  toast(turningOn
    ? (level==='spacious' ? '「今ならゆったり楽しめます」を表示しました。日付が変わると自動で消えます' : '「今なら楽しめます」を表示しました。日付が変わると自動で消えます')
    : '表示をやめました');
  render();
}
async function toggleRainSpecial(){

  await loadSettings(state.currentStoreId);

    const msg = GACHA_CHEER_MESSAGES[Math.floor(Math.random()*GACHA_CHEER_MESSAGES.length)];
    card_type = 'cheer';
    card_text = `${msg.emoji} ${target.name}${msg.send}`;
    receiver_text = `${store.name}${msg.receive}`;
    target_store_id = target.id;
  } else {
    card_type = 'topic';
    card_text = GACHA_TOPIC_CARDS[Math.floor(Math.random()*GACHA_TOPIC_CARDS.length)];
  }
  showModal(`
    <div style="text-align:center;padding:10px 0 4px;">
      ${gachaMachineHtml()}
      <div class="muted" style="margin-top:8px;">回しています…</div>
    </div>
  `);
  const { data, error } = await sb.from('owner_gacha_pulls').insert({
    store_id: store.id, pulled_date: todayStr(), card_type, card_text, receiver_text, target_store_id
  }).select().maybeSingle();
  await new Promise(r=>setTimeout(r, 1000));
  if(error){
    closeModal();
    toast(error.code==='23505' ? '今日はもう回しています' : 'ガチャを回せませんでした');
    await loadGachaToday();
    render();
    return;
  }
  // 3店舗そろったかチェックして、レアボーナスを付与
  const { data: todayRows } = await sb.from('owner_gacha_pulls').select('store_id').eq('pulled_date', todayStr());
  const distinctCount = new Set((todayRows||[]).map(r=>r.store_id)).size;
  if(distinctCount >= GACHA_NETWORK_STORE_COUNT){
    await sb.from('owner_gacha_pulls').update({ rare: true }).eq('id', data.id);
  }
  await loadGachaToday();
  closeModal();
  toast('ガチャを回しました');
  render();
}

    <div class="muted" style="margin-bottom:6px;">見つけにくい場所なら、やさしいヒントを一言。この文章だけが常連さんに見えます。</div>
    <textarea id="findHintInput" placeholder="例: 本多劇場裏の路地を入って突き当り、木の扉が目印です">${store.find_hint || ''}</textarea>
    <button class="btn btn-secondary" style="margin:8px 0 16px;" onclick="saveFindHint()">保存する</button>

    <h3>お店までの道のり動画(常連向け・15秒程度)</h3>
    <div class="muted" style="margin-bottom:6px;">路面から路地裏や階段を上がって、ドアを開けて1秒ほど、までの短い動画です。常連さんだけに表示されます。</div>
    ${store.find_video_path ? `<div class="muted" style="margin-bottom:6px;">現在の状態: 設定済み ✅</div>` : ''}
    <label class="btn btn-secondary" style="display:inline-block;">
      ${store.find_video_path ? '動画を撮り直す・選び直す' : '動画を追加する'}
      <input type="file" accept="video/*" style="display:none;" onchange="uploadFindVideo(event)">
    </label>
    ${store.find_video_path ? ` <button class="btn btn-ghost" style="color:#c77;" onclick="removeFindVideo()">削除する</button>` : ''}
    <div id="findVideoStatus" class="muted" style="margin:6px 0 16px;"></div>

    <h3>常連の定義</h3>
    <div class="muted" style="margin-bottom:6px;">どんな方を常連と考えるか、お店の言葉で(常連さんにも見えます)。</div>
    <textarea id="regularDefInput" placeholder="例: 月に1回以上、顔を見せてくださる方">${store.regular_definition || ''}</textarea>
    <button class="btn btn-secondary" style="margin:8px 0 16px;" onclick="saveRegularDefinition()">保存する</button>

    <h3>外部リンク(Instagram / ホームページ)</h3>
    <div class="muted" style="margin-bottom:6px;">営業時間の細かい変更や期間限定メニューなど、公開情報はこちらに任せて大丈夫です。設定すると、常連さんの画面に「見に行く」リンクが小さく表示されます(アプリの中身がIG側に出ることはありません)。</div>
    <div class="muted" style="margin-bottom:4px;">Instagramのリンク</div>
    <input type="text" id="instagramUrlInput" placeholder="例: https://instagram.com/お店のアカウント" value="${store.instagram_url || ''}">
    <div class="muted" style="margin:10px 0 4px;">ホームページのリンク</div>
    <input type="text" id="websiteUrlInput" placeholder="例: https://お店のサイト.com" value="${store.website_url || ''}">
    <button class="btn btn-secondary" style="margin:8px 0 16px;" onclick="saveExternalLinks()">保存する</button>

    <h3>常連さん向けお知らせ</h3>
    <div class="muted" style="margin-bottom:6px;">臨時休業など、常連さんに伝えたいこと。空欄にして更新すると消えます。</div>
    <textarea id="noticeInput" placeholder="例: 今週土曜は貸切のためお休みです">${set.notice_text || ''}</textarea>
    <button class="btn btn-secondary" style="margin:8px 0 16px;" onclick="saveNotice()">お知らせを更新する</button>

    <h3 style="margin-top:16px;">その他の招待コード</h3>
    <button class="btn btn-secondary" onclick="go('invite')">＋ 別の招待コードを追加する</button>
    <div class="muted" style="margin-bottom:12px;">他のコードも、この端末にまとめて追加できます。</div>
    <h3>アカウント</h3>
    <button class="btn btn-secondary" onclick="askLeave()">このお店の管理権限をリセットする(退会)</button>
  `;
}
async function setNotif(v){
  await sb.from('store_settings').update({notif:v}).eq('store_id', state.currentStoreId);
  await loadSettings(state.currentStoreId); render();
}
async function togglePause(){
  const s = cache.settings[state.currentStoreId];
  await sb.from('store_settings').update({paused: !s.paused}).eq('store_id', state.currentStoreId);
  await loadSettings(state.currentStoreId);
  toast(cache.settings[state.currentStoreId].paused ? '投稿をお休みに設定しました' : '投稿を再開しました');
  render();
}
async function setPerformerStatus(id, v){
  await sb.from('performers').update({status:v}).eq('id', id);
  await loadPerformers(state.currentStoreId); render();
}
async function togglePeerShare(){
  const set = cache.settings[state.currentStoreId] || {};
  const curVal = set.share_with_peers !== false;
  await sb.from('store_settings').update({share_with_peers: !curVal}).eq('store_id', state.currentStoreId);
  await loadSettings(state.currentStoreId);
  toast(cache.settings[state.currentStoreId].share_with_peers===false ? '非公開に設定しました' : '参加店主に公開しました');
  render();
}
async function toggleDetailDisclosure(){
  const set = cache.settings[state.currentStoreId] || {};
  const curVal = detailDisclosureOn(set);
  await sb.from('store_settings').update({ detail_disclosure_on: !curVal }).eq('store_id', state.currentStoreId);
  await loadSettings(state.currentStoreId);
  toast(detailDisclosureOn(cache.settings[state.currentStoreId]) ? '常連さんに開示しました' : '非公開にしました');
  render();
}
async function saveDescription(){
  const val = document.getElementById('descriptionInput').value;
  await sb.from('stores').update({description: val}).eq('id', state.currentStoreId);
  await loadStores();
  toast('紹介文を保存しました');
  render();
}
async function saveFindHint(){
  const val = document.getElementById('findHintInput').value;
  await sb.from('stores').update({find_hint: val}).eq('id', state.currentStoreId);
  await loadStores();
  toast('見つけ方のヒントを保存しました');
  render();
}
function normalizeUrl(val){
  const trimmed = (val || '').trim();
  if(!trimmed) return '';
  if(!/^https?:\/\//i.test(trimmed)) return 'https://' + trimmed;
  return trimmed;
}
async function saveExternalLinks(){
  const ig = normalizeUrl(document.getElementById('instagramUrlInput').value);
  const web = normalizeUrl(document.getElementById('websiteUrlInput').value);
  await sb.from('stores').update({ instagram_url: ig || null, website_url: web || null }).eq('id', state.currentStoreId);
  await loadStores();
  toast('外部リンクを保存しました');
  render();
}
async function uploadFindVideo(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 80*1024*1024){ toast('動画サイズが大きすぎます(80MB以下にしてください)'); e.target.value=''; return; }
  const statusEl = document.getElementById('findVideoStatus');
  if(statusEl) statusEl.textContent = 'アップロード中…しばらくお待ちください';
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
  const path = `${state.currentStoreId}/find.${ext}`;
  const { error: upErr } = await sb.storage.from('store-videos').upload(path, file, { upsert: true, contentType: file.type || 'video/mp4' });
  if(upErr){ if(statusEl) statusEl.textContent=''; toast('アップロードに失敗しました: '+upErr.message); return; }
  // 拡張子が変わった場合に前のファイルが残らないよう、旧パスと異なるときだけ掃除する
  const store = storeById(state.currentStoreId);
  if(store.find_video_path && store.find_video_path !== path){
    await sb.storage.from('store-videos').remove([store.find_video_path]);
  }
  await sb.from('stores').update({ find_video_path: path }).eq('id', state.currentStoreId);
  await loadStores();
  if(statusEl) statusEl.textContent = '';
  toast('道のり動画を保存しました');
  render();
}
async function removeFindVideo(){
  const store = storeById(state.currentStoreId);
  if(!store || !store.find_video_path) return;
  await sb.storage.from('store-videos').remove([store.find_video_path]);
  await sb.from('stores').update({ find_video_path: null }).eq('id', state.currentStoreId);
  await loadStores();
  toast('動画を削除しました');
  render();
}
function askLeave(){
  showModal(`
    <h2>管理権限をリセットしますか?</h2>
    <p class="muted">この端末での店主権限がなくなります(投稿は残ります)。</p>
    <button class="btn btn-danger" onclick="doLeave()">リセットする</button>
    <button class="btn btn-secondary" onclick="closeModal()">やめる</button>
  `);
}
async function doLeave(){
  await sb.from('memberships').delete().eq('store_id', state.currentStoreId).eq('role','owner');
  closeModal();
  await reloadMemberships();
  toast('リセットしました');
  if(cache.memberships.length===0){ state.screen='invite'; } else { await setRole(isOwnerAnywhere()?'owner':'visitor'); }
  render();
}

/* ===================== 常連：一覧・詳細 ===================== */
function renderVisitorList(){
  const statusLabel = {open:'営業中', prep:'準備中', closed:'本日定休'};
  const statusIcon = {open:'🟢', prep:'⚪', closed:'⚫'};
  return `
    <h2>このあたりのお店</h2>
    <div class="muted" style="margin-bottom:12px;">投稿の多さで、お店を比べることはしません。</div>
    ${cache.stores.map(s=>{
      const st = isOpenNow(s);
      const latest = myVisiblePosts(s.id)[0];
      const set = settingsFor(s.id);
      const vLevel = vacancyLevel(set);
      const rain = isRainSpecialToday(set);
      const symbol = storeSymbolIcon(s);
      return `
      <div class="card store-card photo-card" onclick="openStore('${s.id}')">
        <div class="store-photo-wrap">
          ${latest ? `<img src="${latest.image_data}">` : `<div class="no-photo-cover"><span class="no-photo-icon">🏮</span><span class="no-photo-name">${s.name}</span></div>`}
          <div class="store-photo-badges">
            <span class="pill">${statusIcon[st]} ${statusLabel[st]}</span>
            <span class="right-group">
              ${symbol ? `<img class="store-symbol-icon" src="${symbol}">` : ''}
              <span class="pill">${s.type_label}</span>
            </span>
          </div>
          ${vLevel || rain ? `<div class="store-photo-flash">
            ${vLevel==='spacious' ? `<span class="pill ok">🟢 今ならゆったり楽しめます</span>` : ''}
            ${vLevel==='normal' ? `<span class="pill ok">🟢 今なら入れます</span>` : ''}
            ${rain ? `<span class="pill">☔ ${set.rain_special_text || '雨の日特典'}</span>` : ''}
          </div>` : ''}
        </div>
        <div class="store-card-caption">
          <div class="name">${s.name}</div>
          ${latest ? `<div class="muted" style="margin-top:2px;">${relTime(latest.created_at)}に投稿</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  `;
}
async function openStore(id){ state.currentStoreId = id; await go('vdetail'); }
function renderVisitorDetail(){
  const store = storeById(state.currentStoreId);
  const st = isOpenNow(store);
  const statusLabel = {open:'営業中', prep:'準備中', closed:'本日定休'};
  const posts = myVisiblePosts(store.id);
  const groups = {};
  posts.forEach(p=>{ const k=monthLabel(p.created_at); (groups[k]=groups[k]||[]).push(p); });
  const set = settingsFor(store.id);
  return `
    <span class="back-link" onclick="go('vlist')">← 戻る</span>
    <h2>${store.name}</h2>
    <div class="muted">${store.type_label}${detailDisclosureOn(set) ? ' ・ '+(store.description||'') : ''}</div>
    <div style="margin:8px 0;"><span class="status-dot ${st==='open'?'open':'closed'}"></span>${statusLabel[st]} ・ ${store.hours}</div>
    ${(store.instagram_url || store.website_url) ? `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      ${store.instagram_url ? `<a class="btn btn-secondary btn-sm" style="margin:0;text-decoration:none;" href="${store.instagram_url}" target="_blank" rel="noopener noreferrer">📷 Instagramを見る</a>` : ''}
      ${store.website_url ? `<a class="btn btn-secondary btn-sm" style="margin:0;text-decoration:none;" href="${store.website_url}" target="_blank" rel="noopener noreferrer">🌐 ホームページを見る</a>` : ''}
    </div>` : ''}
    ${vacancyLevel(set)==='spacious' ? `<div class="banner notice">🟢 今ならゆったり楽しめます。</div>` : ''}
    ${vacancyLevel(set)==='normal' ? `<div class="banner notice">🟢 今なら入れます。ゆっくり楽しめます。</div>` : ''}
    ${isRainSpecialToday(set) ? `<div class="banner notice">☔ ${set.rain_special_text || '本日は雨の日特典があります'}</div>` : ''}
    ${set.welcome_drink_on ? `<div class="banner">🥂 ${set.welcome_drink_text || 'ネットワークの常連さんにはウェルカムドリンクをご用意します'}</div>` : ''}
    ${set.notice_on && set.notice_text ? `<div class="banner notice">📌 ${set.notice_text}</div>` : ''}
    ${detailDisclosureOn(set) && store.find_hint ? `<div class="banner" style="margin-bottom:10px;">📍 見つけ方: ${store.find_hint}</div>` : ''}
    ${detailDisclosureOn(set) && cache.findVideoUrls[store.id] ? `
      <div class="banner" style="padding:0;overflow:hidden;margin-bottom:10px;">
        <video src="${cache.findVideoUrls[store.id]}" controls playsinline preload="metadata" style="width:100%;display:block;"></video>
        <div class="muted" style="padding:8px;">📍 お店までの道のり(店主撮影・約15秒)</div>
      </div>` : ''}
    ${detailDisclosureOn(set) && store.regular_definition ? `<div class="muted" style="margin-bottom:10px;">このお店が考える「常連」: ${store.regular_definition}</div>` : ''}
    ${renderOwnerPicks(store.id)}
    ${renderStoreMates(store)}
    <div class="banner notice">📸 これは、店主が過去に公開した1枚です。今の様子とは限りません。</div>
    ${posts.length===0 ? '<div class="muted">まだ投稿がありません。お店の様子はここに随時更新されます</div>' :
      Object.keys(groups).map(k=>`
        <h3>${k}</h3>
        <div class="thumb-grid">
          ${groups[k].map(p=>`<img class="thumb" src="${p.image_data}" onclick="openSnapshot('${p.id}','${store.id}')">`).join('')}
        </div>
      `).join('')}
  `;
}
function openSnapshot(id, storeId){
  const p = (cache.posts[storeId]||[]).find(x=>x.id===id);
  showModal(`
    <img class="modal-detail-img" src="${p.image_data}">
    <div class="muted">📅 過去に公開された1枚です。今とは違うことがあります。</div>
    <div style="margin:8px 0;">🕐 ${relTime(p.created_at)}(${absTime(p.created_at)})</div>
    ${p.caption ? `<div>💬 ${p.caption}</div>` : ''}
    ${p.care_badge ? `<div style="margin-top:4px;">🔒 店内のお客様に配慮した写真です</div>` : ''}
    <button class="btn btn-ghost" onclick="closeModal()">閉じる</button>
    <button class="btn btn-ghost" style="color:#c77;margin-top:4px;" onclick="reportSnapshot('${id}')">⚑ 気になる点を報告(運営だけに届きます)</button>
  `);
}
async function reportSnapshot(id){
  await sb.from('reports').insert({post_id: id, reporter_id: state.user.id});
  closeModal();
  toast('報告を受け付けました。運営だけが確認します。');
}
function renderStoreMates(store){
  const my = cache.memberships.find(m=>m.store_id===store.id && m.role==='regular' && m.user_id===state.user.id);
  if(!my) return '';
  const shown = my.show_nickname === true;
  const mates = (cache.storeMates[store.id]||[]).filter(m=>m.id!==my.id);
  return `
    <div class="card">
      <div class="row between">
        <h3 style="margin:0;">顔なじみ</h3>
        <button class="btn ${shown?'btn-secondary':'btn-primary'} btn-sm" onclick="toggleNicknameVisibility('${store.id}')">${shown?'ニックネームを見せています':'見せていません'}</button>
      </div>
      <div class="muted" style="margin-top:8px;">${mates.length>0 ? mates.map(m=>m.nickname).join('、') + ' さん' : 'まだ名乗っている方はいません'}</div>
      <div class="muted" style="margin-top:6px;">見せる・見せないは、いつでも変えられます。連絡先の交換などはできません。</div>
      ${renderGachaBlock(store, my, shown)}
    </div>
  `;
}
function renderGachaBlock(store, my, shown){
  if(my.gacha_claimed){
    return `
      <div class="banner" style="margin-top:12px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:28px;">${store.gacha_item_emoji || '🎁'}</span>
        <div>
          <div style="font-weight:bold;">${store.gacha_item_label || '記念キーホルダー'}</div>
          <div class="muted">顔なじみ記念に獲得済みです</div>
        </div>
      </div>`;
  }
  if(shown){
    return `
      <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="playGacha('${store.id}')">
        🎁 顔なじみ記念ガチャを回す
      </button>`;
  }
  return `<div class="muted" style="margin-top:10px;">ニックネームを見せると、顔なじみ記念のガチャが回せます。</div>`;
}
async function playGacha(storeId){
  showModal(`
    <div style="text-align:center;padding:10px 0 4px;">
      ${gachaMachineHtml()}
      <div class="muted" style="margin-top:8px;">回しています…</div>
    </div>
  `);
  const { error } = await sb.rpc('claim_gacha', { p_store_id: storeId });
  await new Promise(r=>setTimeout(r, 1000));
  if(error){ closeModal(); toast('ガチャを回せませんでした: '+error.message); return; }
  await reloadMemberships();
  const store = storeById(storeId);
  const my = cache.memberships.find(m=>m.store_id===storeId && m.role==='regular' && m.user_id===state.user.id);
  if(!my || !my.gacha_claimed){ closeModal(); toast('ガチャを回せませんでした'); return; }
  showModal(`
    <div style="text-align:center;padding:12px 0;">
      <div style="font-size:64px;">${store.gacha_item_emoji || '🎁'}</div>
      <h2 style="margin:12px 0 4px;">${store.gacha_item_label || '記念キーホルダー'}</h2>
      <div class="muted">${store.name}の顔なじみになった記念に獲得しました</div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="closeModal()">閉じる</button>
    </div>
  `);
  render();
}
async function toggleNicknameVisibility(storeId){
  const my = cache.memberships.find(m=>m.store_id===storeId && m.role==='regular' && m.user_id===state.user.id);
  if(!my) return;
  const next = !(my.show_nickname === true);
  const { error } = await sb.rpc('update_my_nickname_visibility', { p_store_id: storeId, p_show: next });
  if(error){ toast('更新できませんでした'); return; }
  await reloadMemberships();
  await loadStoreMates(storeId);
  toast(next ? 'ニックネームを見せるようにしました' : '見せないようにしました');
  render();
}
function renderOwnerPicks(storeId){
  const recs = (cache.recommendations||[]).filter(r=>r.to_store_id===storeId && r.status==='accepted');
  if(recs.length===0) return '';
  return `
    <h3 style="margin-top:4px;">🎗 他の参加店主からのおすすめ</h3>
    ${recs.map(r=>{
      const from = storeById(r.from_store_id);
      return `<div class="card" style="margin-bottom:8px;"><div class="muted">${from ? from.name : '参加店舗'} さんより</div><div>「${r.template}」</div></div>`;
    }).join('')}
  `;
}

/* ===================== メイン描画 ===================== */
function render(){
  const hasOwner = isOwnerAnywhere();
  const hasAny = cache.memberships.length > 0;
  document.getElementById('tab-owner').classList.toggle('active', state.role==='owner');
  document.getElementById('tab-visitor').classList.toggle('active', state.role==='visitor');
  document.getElementById('tab-owner').disabled = !hasOwner;
  document.getElementById('tab-visitor').disabled = !hasAny;
  document.getElementById('tab-owner').style.display = state.screen==='invite' ? 'none' : '';
  document.getElementById('tab-visitor').style.display = state.screen==='invite' ? 'none' : '';
  document.getElementById('topbar-title').textContent =
    state.screen==='invite' ? '参加する' : (state.role==='owner' ? '店主モード' : '常連モード');

  const el = document.getElementById('screen');
  const map = {
    invite: renderInvite,
    home: renderOwnerHome, preShoot: renderPreShoot, composeGuide: renderComposeGuide,
    camera: renderCamera, privacy: renderPrivacy, performer: renderPerformer,
    caption: renderCaption, confirm: renderConfirm, history: renderHistory, settings: renderSettings,
    vlist: renderVisitorList, vdetail: renderVisitorDetail,
    peers: renderPeers, recommendRequests: renderRecommendRequests, qrCode: renderQrCode,
    regularNotes: renderRegularNotes, murmurs: renderMurmurs
  };
  const fn = map[state.screen] || renderInvite;
  el.innerHTML = fn();
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
</script>
