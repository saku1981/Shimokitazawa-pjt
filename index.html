<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>さんサク</title>
<style>
  :root{
    --bg:#fffaf0;
    --ink:#6b5a47;
    --ink-soft:#8a7a68;
    --accent:#e2794f;
    --accent-dark:#c4592f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--bg);
    font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Sans",sans-serif;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  /* Shared, hidden library of the mascot+logo artwork - defined once, reused via <use> */
  .art-defs{position:absolute;width:0;height:0;overflow:hidden;}

  .screen{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--bg);
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    transition:opacity .55s ease;
  }

  /* ---------------- Splash / loading screen ---------------- */
  #splash-screen{z-index:20;}
  #splash-screen.hide{opacity:0;pointer-events:none;}
  .splash-art{width:78%;max-width:360px;}
  .loading-dots{display:flex;gap:11px;margin-top:34px;}
  .loading-dots span{
    width:12px;height:12px;border-radius:50%;background:var(--accent);
    opacity:.35;animation:dotPulse 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2){animation-delay:.15s;}
  .loading-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{
    0%,80%,100%{opacity:.3;transform:scale(.8);}
    40%{opacity:1;transform:scale(1.15);}
  }

  /* ---------------- Welcome screen (first screen after login) ---------------- */
  #welcome-screen{z-index:10;opacity:0;pointer-events:none;}
  #welcome-screen.active{opacity:1;pointer-events:auto;}
  .welcome-art{width:56%;max-width:270px;}
  .welcome-title{
    margin:14px 0 8px;font-size:21px;font-weight:900;color:var(--ink);letter-spacing:.02em;
  }
  .welcome-sub{
    margin:0 12px;max-width:320px;text-align:center;
    font-size:14.5px;line-height:1.9;color:var(--ink-soft);
  }
  .start-btn{
    margin-top:32px;padding:16px 54px;border:none;border-radius:999px;
    background:var(--accent);color:#fff;font-size:16.5px;font-weight:900;letter-spacing:.05em;
    box-shadow:0 10px 22px rgba(226,121,79,.35);
    font-family:inherit;
  }
  .start-btn:active{transform:scale(.96);}
</style>
</head>

  <!-- ===================================================================
       1) SPLASH / LOADING SCREEN
       Shown immediately on launch. Real data/asset loading happens in the
       background via loadAppData() below; the mascot is purely the
       foreground visual while that happens.
  ==================================================================== -->
  <div id="splash-screen" class="screen">
    <svg class="splash-art" viewBox="0 0 1000 1360"><use href="#mascotLogoArt"/></svg>
    <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>

  <!-- ===================================================================
       2) WELCOME SCREEN - the first screen shown right after login
  ==================================================================== -->
  <div id="welcome-screen" class="screen">
    <svg class="welcome-art" viewBox="0 0 1000 1360"><use href="#mascotLogoArt"/></svg>
    <div class="welcome-title">ようこそ、さんサクへ</div>
    <p class="welcome-sub">気の向くまま、ゆるっとつながろう。<br>店主同士の、ゆるいつながりをサクッと。</p>
    <button class="start-btn" id="startBtn" type="button">はじめる</button>
  </div>

<script>
  // -----------------------------------------------------------------
  // 1) Splash screen lifecycle
  // -----------------------------------------------------------------
  // Replace loadAppData() with your real bootstrap sequence: auth check,
  // fetching the logged-in user's data, preloading images/fonts, etc.
  // Whatever it does, resolve the returned Promise when the app is ready.
  function loadAppData(){
    return new Promise(function(resolve){
      // --- DEMO ONLY: simulates network/asset loading. Replace this. ---
      setTimeout(resolve, 1800);
    });
  }

  // Splash stays on screen at least this long even if loading finishes
  // faster, so it never just flashes by.
  var MIN_SPLASH_MS = 1200;
  var splashStart = performance.now();

  loadAppData().then(function(){
    var elapsed = performance.now() - splashStart;
    var remaining = Math.max(0, MIN_SPLASH_MS - elapsed);
    setTimeout(showWelcomeScreen, remaining);
  });

  function showWelcomeScreen(){
    document.getElementById('splash-screen').classList.add('hide');
    document.getElementById('welcome-screen').classList.add('active');
  }

  // -----------------------------------------------------------------
  // 2) Welcome screen CTA
  // -----------------------------------------------------------------
  // Wire this up to whatever the real "home" screen is once it exists.
  document.getElementById('startBtn').addEventListener('click', function(){
    // TODO: navigate to the real home/main screen of the app.
    alert('ここから実際のホーム画面へ遷移します(開発者向けの仮の動作です)');
  });
</script>
